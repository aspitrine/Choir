services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chorale
      POSTGRES_PASSWORD: chorale
      POSTGRES_DB: chorale
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chorale']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chorale
      MINIO_ROOT_PASSWORD: chorale-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # The bucket stays private, as in production: the app only hands out presigned
  # URLs. `anonymous set none` also revokes public access on volumes created when
  # this script used to make the bucket world-readable.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 chorale chorale-secret &&
      mc mb -p local/chorale &&
      mc anonymous set none local/chorale
      "

volumes:
  postgres_data:
  minio_data:
